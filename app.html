<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램·라인·밴드 등 앱 안 브라우저로 열리면 기본 브라우저(크롬·사파리)로 다시 열기 */
(function () {
  if (window.top !== window.self) return;
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|NAVER\/|FBAN|FBAV|FB_IAB|FBIOS|Instagram|\bLine\/|DaumApps|BAND\/|everytimeApp|Whale\/[\d.]+ .*inapp|; wv\)/i.test(ua);
  if (!inApp) return;
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/\bLine\//i.test(ua)) {
    if (url.indexOf('openExternalBrowser=1') < 0) location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // 아이폰의 앱 안 브라우저는 사파리로 바로 넘길 수 없어 안내 화면을 띄움
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(20,24,32,.94);color:#f2f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 -apple-system,system-ui,sans-serif;word-break:keep-all';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리나 화면이 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래 ⋯ 또는 공유 버튼에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button type="button" data-a="copy" style="font:inherit;padding:10px 20px;border-radius:999px;border:0;background:#f2f3f6;color:#141820">주소 복사</button>' +
      '<button type="button" data-a="stay" style="font:inherit;background:none;border:0;color:#aab0bd;text-decoration:underline">그냥 여기서 보기</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (a === 'stay') box.remove();
      if (a === 'copy') {
        var b = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
          function () { b.textContent = '복사했어요'; },
          function () { window.prompt('주소를 복사해 사파리에 붙여 넣어 주세요', url); });
      }
    });
    document.body.appendChild(box);
  });
})();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글 발음 비교 (ㄱ, ㄲ, ㅋ)</title>
    <!-- 구글 폰트 'Noto Sans KR' 추가 (고딕체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <div style="display: flex; gap: 1vw; align-items: center;">
            <a href="index.html" class="btn" style="text-decoration: none; color: black; display: flex; align-items: center; justify-content: center; height: 100%; white-space: nowrap;">🏠</a>
            <h1 id="app-title">ㄱ, ㄲ, ㅋ</h1>
        </div>
        <div class="header-buttons">
            <button id="shuffle-btn" class="btn">카드 섞기 (1단계)</button>
            <button id="color-toggle" class="btn">색깔 끄기</button>
            <button id="settings-btn" class="btn">⚙️ 색상 설정</button>
        </div>
    </header>
    <main id="app-container">
        <!-- 자바스크립트로 카드가 동적으로 생성됩니다. -->
    </main>

    <!-- 설정 모달창 -->
    <div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 3vw; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 2vh; min-width: 400px;">
            <h2 style="margin: 0; font-size: 4vh; text-align: center;">🎨 행별 배경색 설정</h2>
            <div id="dynamic-color-settings" style="display: flex; flex-direction: column; gap: 1.5vh; max-height: 50vh; overflow-y: auto;">
                <!-- JS에서 동적으로 색상 창 렌더링 -->
            </div>
            <div style="display: flex; gap: 10px; margin-top: 2vh;">
                <button id="save-colors-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #e0f7fa; border-color: #80deea;">저장</button>
                <button id="reset-colors-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #fff9c4; border-color: #fff176;">초기화</button>
                <button id="close-modal-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #fce4ec; border-color: #f48fb1;">닫기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
