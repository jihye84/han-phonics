<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글 발음 비교 (ㄱ, ㄲ, ㅋ)</title>
    <!-- 구글 폰트 'Noto Sans KR' 추가 (고딕체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <div style="display: flex; gap: 1vw; align-items: center;">
            <a href="index.html" class="btn" style="text-decoration: none; color: black; display: flex; align-items: center; justify-content: center; height: 100%; white-space: nowrap;">🏠</a>
            <h1 id="app-title">ㄱ, ㄲ, ㅋ</h1>
        </div>
        <div class="header-buttons">
            <button id="shuffle-btn" class="btn">카드 섞기 (1단계)</button>
            <button id="color-toggle" class="btn">색깔 끄기</button>
            <button id="settings-btn" class="btn">⚙️ 색상 설정</button>
        </div>
    </header>
    <main id="app-container">
        <!-- 자바스크립트로 카드가 동적으로 생성됩니다. -->
    </main>

    <!-- 설정 모달창 -->
    <div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 3vw; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 2vh; min-width: 400px;">
            <h2 style="margin: 0; font-size: 4vh; text-align: center;">🎨 행별 배경색 설정</h2>
            <div id="dynamic-color-settings" style="display: flex; flex-direction: column; gap: 1.5vh; max-height: 50vh; overflow-y: auto;">
                <!-- JS에서 동적으로 색상 창 렌더링 -->
            </div>
            <div style="display: flex; gap: 10px; margin-top: 2vh;">
                <button id="save-colors-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #e0f7fa; border-color: #80deea;">저장</button>
                <button id="reset-colors-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #fff9c4; border-color: #fff176;">초기화</button>
                <button id="close-modal-btn" class="btn" style="flex: 1; font-size: 2.5vh; background: #fce4ec; border-color: #f48fb1;">닫기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
